<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estudia Bombero</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #172033;
      margin: 0;
      padding: 24px;
    }
    header {
      background: #123b2b;
      color: white;
      padding: 25px;
      border-radius: 16px;
      text-align: center;
    }
    h1 { margin-top: 0; }
    .card {
      background: white;
      padding: 20px;
      margin-top: 18px;
      border-radius: 12px;
      box-shadow: 0 2px 8px #0001;
    }
    button {
      background: #176b48;
      color: white;
      border: 0;
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <header>
    <h1>🚒 Estudia Bombero</h1>
    <p>Tu espacio para preparar las oposiciones</p>
  </header>

  <section class="card">
    <h2>📚 Mis temas</h2>
    <p>Organiza aquí tus temas de estudio.</p>
    <button onclick="alert('Próximamente podrás organizar tus temas')">
      Ver mis temas
    </button>
  </section>

  <section class="card">
    <h2>📝 Exámenes</h2>
    <p>Prepara tus exámenes tipo test y practica tus conocimientos.</p>
    <button onclick="alert('Próximamente podrás realizar tests')">
      Hacer un test
    </button>
  </section>

  <section class="card">
    <h2>📈 Mi progreso</h2>
    <p>Próximamente podrás consultar tus resultados y tu evolución.</p>
  </section>
</body>
</html>
